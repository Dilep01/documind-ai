[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-ai"
version = "0.1.0"
description = "Local OCR, evidence-linked invoice review, approved exports, and document search."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pdfplumber>=0.11,<0.12",
  "pydantic>=2.10,<3",
  "reportlab>=4.4,<6",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23,<26",
  "httpx>=0.28,<1",
  "pytesseract>=0.3.13,<1",
  "pillow>=12.2,<14",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "pgvector>=0.4,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
documind = "documind_ai.cli:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]
