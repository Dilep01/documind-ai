name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: documind_test
          POSTGRES_USER: documind
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U documind -d documind_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOCUMIND_DATABASE_URL: postgresql+psycopg://documind:ci-only-test-password@localhost:5432/documind_test
      DOCUMIND_STORAGE: storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m documind_ai.manage migrate
      - run: python -m ruff check backend scripts
      - run: python -m ruff format --check backend scripts
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
